name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # The extra index supplies the CPU build of PyTorch; the default Linux wheel
        # bundles GPU libraries the tests never use. Versions still come from requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        # Uses the committed mock, example and seasonal-sample data. Tests that need a
        # running PostgreSQL database skip themselves.
        run: python -m unittest discover -s tests

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t solar-ai-backend .

      - name: Generate one recommendation in the container
        # No API key and no network data: a recorded hour from the committed sample, templated explanations.
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/out" solar-ai-backend --skip-lstm --no-llm --output /out/recommendation.json

      - name: Check the result
        run: python -c "import json; d = json.load(open('out/recommendation.json')); assert d['decision']['action'] in ('ROTATE', 'HOLD', 'STOW'), d['decision']; print(d['selected_model'], d['decision']['action'], d['decision']['target_angle_deg'])"

      - name: Report image size
        run: docker image inspect solar-ai-backend --format 'Image size {{.Size}} bytes'

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
